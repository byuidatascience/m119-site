format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"
    include-in-header:
      text: |
        <script>
        window.MathJax = {
          tex: {
            macros: {
              ds: "\\displaystyle",
              diff: ["\\frac{d#1}{d#2}", 2],
              pd: ["\\frac{\\partial^{#3} #1}{\\partial #2^{#3}}", 3]
            }
          }
        };
        </script>

execute:
  freeze: auto
